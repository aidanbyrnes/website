<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTURA</title>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
    }

    iframe {
      aspect-ratio: 16 / 9;
      width: min(60vw, 1080px);
      height: auto;
      margin: auto;
      display: block;
    }

    .poster {
        width: min(80vw, 1080px);
        height: auto;
        margin: auto;
        display: block;
    }
    @media screen and (orientation:portrait) {
        .poster {
            width: 100vw;
            height: auto;
        }
    }
  </style>
</head>
<body>
  <iframe src="https://www.youtube.com/embed/XjtFx2bKUuo?si=XXeY4tB7VvgddrSH" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <img src="poster.svg" alt="Poster" class="poster">
</body>
</html>
