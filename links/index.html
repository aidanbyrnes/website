<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Aidan Byrnes</title>
    <style>
        @font-face {
            font-family: Main;
            src: url(../Montserrat-VariableFont_wght.ttf);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Main, monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #background {
            filter: blur(100px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .title-box {
            /*border: 1px solid #ffffff;*/
            padding: 15px 20px;
            margin-bottom: 20px;
            position: relative;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
        }

        .title-box h1 {
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        .header-box {
            text-transform: uppercase;
            border: 1px solid #ffffff;
            text-align: center;
            text-decoration: none;
            color: #000000;
            display: block;
            transition: all 0.2s ease;
            position: relative;
            background-color: rgb(255, 255, 255);
        }

        .connection {
            width: 1px;
            height: 50px;
            background-color: rgba(255, 255, 255, .5);
            margin: 0 auto 0;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-node {
            position: relative;
        }

        .link-box {
            border-bottom: 1px solid #ffffff;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            display: block;
            transition: all 0.2s ease;
            position: relative;
            background-color: rgba(0, 0, 0, 0.85);
        }

        .link-box:hover {
            background-color: rgba(26, 26, 26, 0.9);
        }

        .link-box:active {
            background-color: #ffffff;
            color: #000000;
        }

        .link-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            opacity: 0.7;
        }

        .link-text {
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .title-box h1 {
                font-size: 20px;
            }
            
            .bio-box {
                font-size: 14px;
            }
            
            .link-text {
                font-size: 14px;
            }

            .header-box {
                font-size: 14px;
            }
        }
    </style>
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
